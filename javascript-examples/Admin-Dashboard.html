<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script src="../src/scripts/Book my show.js"></script>
</head>
<body class="container-fluid" onload="LoadMovies()">
    <h3 class="bi bi-ticket-detailed">Book My Show  -  Admin Dashboard</h3>
    <div class="mt-4 w-25" >
      <div class="mb-3">
        <label class="form-label" >Add new movie</label>
        <div class="input-group">
        <input type="text" id="txtMovie" class="form control">
        <button   onclick="AddClick()" class="btn btn-primary">Add</button>
        </div>
      </div> 
      <div>
        <div class="mb-2">
            <button onclick="SortAsc()" class="btn btn-success bi bi-sort-alpha-down"></button>
            <button onclick="SortDesc()" class="btn btn-success bi bi-sort-alpha-up mx-2"></button>
        </div>
        <select class="form-select" id="lstMovies" size="3"></select>
        <div class="mt-2">
            <label id="lblCount" class="fw-bold">  </label>
        </div>
      </div>
      <div class="mt-2">
        <button data-bs-target="#edit" data-bs-toggle="modal" class="bi bi-pen btn btn-warning"  onclick="EditClick()"> Edit</button>

        <div class="modal fade" id="edit">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h3>EDIt Movie</h3>
                
              </div>
              <div class="modal-body">
                <input type="text" id="txtEditMovie" class="form-control">

              </div>
              <div class="modal-footer">
                <button data-bs-dismiss="modal" class="btn btn-success" onclick="SaveClick()">Save</button>
                <button data-bs-dismiss="modal"  class="btn btn-danger">Cancel</button>

              </div>

            </div>

          </div>

        </div>
        <button onclick="DeleteClick()" class="bi bi-trash btn btn-danger"> Delet</button>
        <button onclick="ClearClick()" class="bi bi-trash-fill btn btn-outline-danger"> Clear All</button>

      </div>
    </div>

    
</body>
</html>
