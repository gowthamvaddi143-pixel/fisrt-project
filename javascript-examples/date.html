<script>
    var now = new Date();
    now.setHours(13)
    var hrs = now.getHours();
    if(hrs>=0 && hrs<=12){
        document.write("Good Morning");

    }else if(hrs>12 && hrs<=17){
        document.write("Good Afternoon");


    }else{
        document.write("Good Evening");
    }
</script>
