<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet"  href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <script>
        function SortClick(){
            var sortButton = document.querySelector("button");
            sortButton.className = (sortButton.className=="bi bi-sort-alpha-down")?"bi bi-sort-alpha-up":"bi bi-sort-alpha-down";
        }

function ToggleAds(){
    var dialog  = document.querySelector("dialog");
    var checkbox = document.getElementById("chkAds");
    dialog.open = (checkbox.checked)?true:false ; 
}

    </script>

</head>
<body class="container-fluid  p-5">    
    <button class=" bi bi-sort-alpha-down " onclick="SortClick()"></button>
    <div class="mt-3">
        <input type="checkbox" id="chkAds" onchange="ToggleAds()" class="form-check-input"> <label> Show Ads</label>
        <dialog>
            <img src="../public/images/a10.jpg" width="100" height="100">
        </dialog>

    </div>
    
</body> 
</html>
