<h1>For (looping)</h1>

<script>
    var values = [10,20,30,40]
    for(var i=0; i<values.length; i++){
        document.write(values[i] + "<br>")
    }
</script>


<script>
    var n = parseInt(prompt("Enter Number"));
    for(var i=1; i<=10; i++){
        document.write(`${n}X${i}=${n*i} <br>`);
    }

</script>
<br>

<h1>While  LOOP</h1>
<script>
    var n = parseInt(prompt("Enter Number"));
    var i=1;
    while(i<=10){
        document.write(`${n}X${i}=${n*i} <br>`);
        i++;
    }
</script>

<h1>DO while</h1>
<script>
     var n = parseInt(prompt("Enter Number"));
    var i=11;
    do{
        document.write(`${n}X${i}=${n*i} <br>`);
        i++;
    }while(i<=10)

</script>
