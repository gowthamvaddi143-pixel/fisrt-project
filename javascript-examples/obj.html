<script>
let obj = {
    Name : "TV",
    Price:40000,
    Qty:2,
    total: function (){
        return this.Qty * this.Price;

     },
     Print: function(){
        document.write(`Name=${this.Name}<br>Price=${this.Price}<br>Qty=${this.Qty}<br>total=${this.total()}`)

     }
   
}    
obj.Qty = parseInt(prompt("Enter Qty"))
obj.Print();


</script>
