<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather APP</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script  src="../src/scripts/weather.js"></script>

</head>  
<body class="container-fluid" onload="LoadWeatherData('Hyderabad')">
    <section class="row">
        <nav class="col-2 bg-dark text-white p-3" style="height: 100vh;"> 
            <div class="fs-4 fw-bold mb-3 bi bi-cloud">Weather App</div> 
            <div class="bi bi-columns-gap fs-5">Dashboard</div>
            <div class="mt-4">
                <label class="form-label fw-bold">Popular Cities</label>
                <div>
                    <select onchange="CityChenge()" class="form-select" id="lstCities">
                        <option >select City</option>
                        <option>Delhi</option>
                        <option>Hyderabad</option>
                        <option>Chennai</option>
                        <option>Hyderabad</option>
                        <option>London</option>
                    </select>
                </div>
            </div>
        </nav>
        <main class="col-10"> 
            <header class="mt-3 p-2 d-lg-flex justify-content-between">
                <div >
                    <div class="input-group" >
                        <input type="text" id="txtSearch" placeholder="Search by City Name " class="form-control">
                        <button onclick="SearchClick()" class="btn btn-dark bi bi-search"></button>
                    </div>

                </div>
                <div class="bi bi-person-fill  fs-5">
                    Your  Profile

                </div>
            </header>
            <div class="mt-4 card w-75 bg-dark text-white d-flex flex-column justify-content-between p-4"  style="height: 400px;">
               <div>
                    <div id="lblCity" class="fs-2 fw-bold bi bi-geo-alt"></div>
                    <div class="ms-4" id="lblDetails"></div>
                </div>
                <div id="lblTemp" class=" fw-bold" style="font-size: 100px;"></div>

            </div>

        </main>
    </section>

    
</body>
</html>
