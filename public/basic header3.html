<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic header3</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        header{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            background-color: #ffffff;
            color: #333333;
            padding: 17px;
            align-items: center;
            font-family: montserrat,sans-serif;
            font-weight: bolder;
            /* box-shadow: 0 0px 7px rgb(0,0,0,0.5); */


        }
        nav span{
            padding-right: 14px;
        }
               
        .bi-flower1{
            padding-right: 1px;
            font-size: 30px;
            color: #00f29d;

        }
        .button{
            padding-right: 25px;
            
        }
        .logo{
            padding-right: 15px;
        }
        .bi-search{
            padding-left: 15px;
            color: linear-gradient(to right,#adff2f,#00f29d);
            cursor: pointer;
            font-size: 17px;
            color: #00f29d;
        }
        button{ 
            padding: 9px;
            width: 100px;
            border-radius: 20px;
            background: linear-gradient(to right,#adff2f,#00f29d);
            cursor: pointer;
        }
        button:hover{
            background-color: #00f29d;
            
        }
        .head{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            background-color: #343333;
            color: #FFFFFF;
            padding: 7px;

        }
        .icon{
            padding-right: 20px;
        }
        .bi-facebook,.bi-twitter,.bi-pinterest{
            padding-left: 15px;
        }
        .bi-phone{
            padding-left: 10px;
            padding-right: 10px;
        }
        .number{
            padding-right: 10px;
        }



    </style>
</head>

<body>
    <header class="head">
        <div>
            <span class="bi bi-phone"></span>
            <span class="number">(001)88451234</span>
            <span class="number">88455438</span>

        </div>
        <div class="icon">
            <span class="bi bi-facebook"></span>
            <span class="bi bi-twitter"></span>
            <span class="bi bi-pinterest"></span>
        </div>
    </header>
    <header>
        <div class="brand-logo">
            <span class="bi bi-flower1"></span>
            <span class="logo">Phiox</span>
            <span class="logo">Business</span>

        </div>

        <div>
            <nav>
                <span>HOME</span>
                <span>ABOUT</span>
                <span>SERVICES</span>
                <span>SHOWCASE</span>
                <span>BLOG</span>
                <span>CONTACT</span>
            </nav>


        </div>
         
             


        <div class="button">
            <button>Purchase</button>
            <span class="bi bi-search"></span>


        </div>


    </header>
    
</body>
</html>
