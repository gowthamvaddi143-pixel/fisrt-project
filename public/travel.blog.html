<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Blog</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        header{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            font-family: arial;
            background-color: rgb(4, 181, 78);
            align-items: center;
            border-radius: 5px;
            padding: 10px;
            color: white;


        }
        .brand{
            font-size: 22px;
            font-weight: bold;

        }
        nav{
            margin-right: 30px;
            font-size: 18px;
        }
        article{
            height: 742px;
            background-image: url("./images/travel-banner-1.jpg");
            background-size:100% 100% ;
            margin-top: 30px;
            font-family: arial;
            color: white;

        }
        .offer{
            background-color: rgb(139, 0, 134);
            color: white;
            padding: 5px;
            width: 250px;
            text-align: center;
            border-radius: 10px;
            width: 250px;
            

        }
        .hero-title{
            font-size: 60px;
            font-weight: bold;
            margin-top: 60px;
            text-shadow: 4px 3px 2px black;
        }
        .hero-subtitle{
             font-size: 50px;
            font-weight: bold;
            margin-top: 10px;
            text-shadow: 4px 3px 2px black;
        }
        .hero-text{
            width: 500px;
            text-shadow: 2px 2px 1px black;
            text-align: justify;
            margin-top: 20px;
            margin-bottom: 20px;
            line-height: 30px;

            
        }
        .buttons{
            margin-top: 70px;
        }
        .btn-explore{
            background-color: rgb(9, 9, 216);
            color: white;
            font-size: 18px;
            padding: 14px;
            border-radius: 10px;

        }
        .btn-collections{
            background-color: white;
            color: black;
            margin-left: 10px;
            font-size: 18px;
            padding: 14px;
            border-radius: 10px;
        }
        .shade{
            padding: 40px;
            height: 662px;
            background-color: rgba(0,0,0,0.5);


        }

    </style>
</head>
<body>
    <header>
        <div>
            <span class="brand"> <span class="bi bi-airplane"></span>My Travel Blog</span>
        </div>
        <div>
            <nav>
                <span>Destination</span>
                <span>Stories</span>
                <span>Photos</span>
                <span> About</span>
            </nav>
        </div>
        <div> 
            <span class="bi bi-search"></span>
        </div>
    </header>
    <section>
        
        <article>
         <div class="shade">
            <div class="offer">50% OFF-SUMMER-2026</div>
            <div class="hero-title">Discover Your Next</div>
            <div class="hero-subtitle">Great Adventure</div>
            <div class="hero-text"> Immerse yourself in hand-picked 
                narratives from the world's most remote corners. Curated stories for the discerning modern traveler.</div>
            <div class="buttons">
                <span class="btn-explore">Explore Now </span>

                <span class="btn-collections">View Collections</span>
            </div>

       </div>
        </article>
       
    </section>
    
</body>
</html>
