<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple header 2</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        header{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            background-color: #28282a;
            color: #f5f5f7;
            padding: 18px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 13.5px;
            font-weight: 400;
            letter-spacing: -0.01em;
             box-shadow: 0 0px 10px rgb(0,0,0,0.5);

        }
        nav span{
            padding-right: 30px;
            cursor: pointer;
        }
        .bi-bag-check,.bi-search{
            padding-right: 30px;
            cursor: pointer;
        }
        .bi-apple{
            padding-right: 30px;

        }
   
        .hover:hover{
            color: rgb(206, 206, 202);
        }
        .bi-search:hover{
            color: rgb(205, 205, 201);
            
        }
        .bi-bag-check:hover{
            color:  rgb(205, 205, 201);
        }




    </style>
</head>

<body>
<header>
    <div>
        <span class="bi bi-apple"></span>
        
    </div>
    
    <div>
        <nav>
            <span class="hover">Store</span>
            <span class="hover">Mac</span>
            <span class="hover">iPad</span>
            <span class="hover">iPhone</span>
            <span class="hover">Watch</span>
            <span class="hover">Vision</span>
            <span class="hover">AirPods</span>
            <span class="hover">TV&Home</span>
            <span class="hover">Entertainment</span>
            <span class="hover">Accessorise</span>
            <span class="hover">Support</span>

        </nav>



    </div>
        

    <div>
        <span class="bi bi-search"></span>
         <span class="bi bi-bag-check"></span>
    </div>
</header>
</body>
</html>
