<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basich-eader</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        header{
            background-color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0px 10px rgb(0,0,0,0.5);

            font-family: inter,segoe ui, roboto, helvetica,arial,sans-serif;
        }
        .search-bar{
            background-color: #f3f4f6;
            padding: 7px;
            width: 350px;
            border-radius:29px ;
            font-size: 15px;
            color: #6b7280;
            border: 1px solid #e5e7eb;
        }
       
        .brand-logo{
            color: orangered;
            font-weight: bold;
            font-family: arial;
            font-size: 28px;

        }
        .bar{
            font-size: 13px;
            padding-left: 5px;
            color: #6b7280;
        }
        .icon-text span{
            padding-right:16px ;
            font-size: 15px;
            font-weight: bolder;
        }


    </style>

</head>
<body>
    <header>
        <div class="brand-logo">
            QuickBite

        </div>


        <div>
            <div class="search-bar">
                <span class="bi bi-search"></span>
                <span class="bar">Search for food or restaurants</span>
            </div>
        </div>


        <div class="icon-text">
            <nav>
                 <span>Home</span>
                  <span>Offers</span>
                  <span>Help</span>
                  <span>Sing In</span> 
                 <span class="bi bi-bag"></span>
            </nav>
        </div>
    </header>
    
</body>
</html>
