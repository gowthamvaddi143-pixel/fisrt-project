<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <style>
       
        header {

            background-color: #e8e6e6;

            padding: 20px;

            font-family: Arial;

            font-size: 14px;

            display: flex;

            flex-direction: row;

            justify-content: space-between;

            align-items: center;

            box-shadow: black

        }

        .brand-logo {

            font-size: 60px;

            color:red;

            font-family: Brush Script MT;

            font-weight: bold;

        }

        nav {

            text-transform: uppercase;

            font-weight: bold;

            margin-left: 20px;

        }

        nav span {

            padding-right: 20px;

        }

        .search-bar {

            background-color: #bfbfbf;

            width: 300px;

            padding: 10px;

            font-size: 15px;

        }

      

        .icon-text {

            font-size: 14px;

            font-weight: bold;

        }

        .navbar {

            display: flex;

            flex-direction: row;

            align-items: center;

            justify-content: space-between;

        }

        .nav-text {

            display: block;

            font-weight: bold;

        }

        .short-cuts {

            display: flex;

            justify-content: space-between;

            width: 200px;

            text-align: center;

        }

        .bi-person, .bi-heart, .bi-bag {

            font-size: 23px;

        }
    


    </style>
</head>
<body>
 <header>

        <div class="navbar">

            <span class="brand-logo">M</span>

            <nav>

                <span>Men</span>

                <span>Women</span>

                <span>Kids</span>

                <span>Home</span>

                <span>Beauty</span>

                <span>Genz</span>

                <span>Studio</span>

            </nav>

        </div>

        <div>

           <div class="search-bar">

              <span class="bi bi-search"></span>

              <span>Search for products, brands and more</span>

           </div>

        </div>

        <div class="short-cuts">

            <div>

                <span class="bi bi-person"></span>

                <span class="nav-text">Profile</span>

            </div>

            <div>

                <span class="bi bi-heart"></span>

                <span class="nav-text">Wishlist</span>

            </div>

            <div>

                <span class="bi bi-bag"></span>

                <span class="nav-text">Bag</span>

            </div>

        </div>

    </header>

</body>
</html>
