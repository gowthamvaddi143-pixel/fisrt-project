
 <!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-Commerce</title>

    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../src/styles/e-commerce.css">

</head>

<body>

    <header>

        <div class="toggler">

            <button class="bi bi-justify"></button>

        </div>

        <div>

            <span class="bi bi-bag-fill"> </span>

            <span>Shop</span>

        </div>

        <nav>

            <span>Home</span>

            <span>New Arrivals</span>

            <span>Offers</span>

            <span>Sale</span>

            <span>About</span>

        </nav>

        <div class="short-cuts">

            <span class="bi bi-search"></span>

            <span class="bi bi-heart"></span>

            <span class="bi bi-person"></span>

            <span class="bi bi-cart4"></span>

        </div>

    </header>

    <article>

        <div class="col-1">

            <div>

            <div class="btn-container">

                <div class="article-button"> <span class="bi bi-lightning-fill"></span> New Collection 2032</div>

                <div class="article-title">Step Into <br><span>Your Best</span></div>

                <div class="article-text">

                    Premium footwear for every step of your journey. From athletic performance to everyday comfort.

                </div>

            </div>

            

            <div>

                <button class="btn-shop">Shop Now <span class="bi bi-arrow-right"></span> </button>

                <button class="btn-browse">Browse Categories</button>

            </div>

            <div class="article-facts">

                <div>

                    50K+

                    <div class="fact-text">Happy Customers</div>

                </div>

                <div>

                    4.9 <span class="bi bi-star-fill"></span>

                    <div class="fact-text">Average Rating</div>

                </div>

                <div>

                    300+ 

                    <div class="fact-text">Styles Available</div>

                </div>

            </div>

            </div>

        </div>

        <div class="col-2">

            <img src="../public/images/shoe.jpg" class="article-image">

        </div>

    </article>
    

</body>

</html>
