<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:first-child{
            background-color: red;
        }
        li:last-child{
            background-color: yellow;
        }
        li:nth-child(5){
            background-color: blue;
        }
        li:nth-of-type(3n){
            background-color: darkgoldenrod;
        }
    </style>
</head>
<body>
<ol>
    <li>Item-1</li>
     <li>Item-2</li>
      <li>Item-3</li>
       <li>Item-4</li>
        <li>Item-5</li>
         <li>Item-6</li>
          <li>Item-7</li>
           <li>Item-8</li>
            <li>Item-9</li>
             <li>Item-10</li>


    
</ol>
    
</body>
</html>
